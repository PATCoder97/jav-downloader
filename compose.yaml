services:
  web:
    image: hls-web:latest
    build: .
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    shm_size: 1gb
    environment:
      HLS_CONCURRENT_FRAGMENTS: "8"
    volumes:
      - downloads:/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  downloads:
