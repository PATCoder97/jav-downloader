name: hls-downloader

services:
  web:
    image: patcoder97/jav-downloader:latest
    init: true
    restart: unless-stopped
    ports:
      - "8088:8000"
    shm_size: "1gb"
    environment:
      HLS_CONCURRENT_FRAGMENTS: "8"
    volumes:
      - hls_downloads:/downloads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  hls_downloads:

x-casaos:
  architectures:
    - amd64
  main: web
  author: patcoder97
  category: Utilities
  title:
    en_us: HLS Downloader
  description:
    en_us: Detect M3U8 playlists in a web page and download permitted videos.
  port_map: "8088"
  scheme: http
  index: /
