<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tải video HLS</title>
<style>body{font:16px system-ui;max-width:850px;margin:60px auto;padding:20px;background:#101827;color:#e7edf7}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #58677e}input{flex:1;min-width:0}button{cursor:pointer;background:#a5caff}form{display:flex;gap:10px}article{background:#202e43;padding:18px;margin:18px 0;border-radius:12px}code{display:block;overflow-wrap:anywhere;margin-bottom:12px}a{color:#a5caff}#status{white-space:pre-wrap}</style>
<h1>Tải video HLS</h1><p>Nhập URL trang video hoặc playlist M3U8 mà bạn sở hữu hoặc được phép tải. Không hỗ trợ DRM hay vượt đăng nhập.</p>
<form id="form"><input id="url" type="url" required placeholder="https://example.com/video"><button id="scan">Tìm M3U8</button></form>
<p id="status" role="status"></p><section id="results"></section>
<script>
const statusEl=document.querySelector('#status'),results=document.querySelector('#results');
async function api(url,options={}){const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Yêu cầu thất bại');return d;}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const button=document.querySelector('#scan');button.disabled=true;results.replaceChildren();statusEl.textContent='Đang mở trang và tìm video…';try{const data=await api('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:document.querySelector('#url').value})});statusEl.textContent=data.message||`Tìm thấy ${data.streams.length} playlist.`;for(const stream of data.streams){const card=document.createElement('article'),code=document.createElement('code'),download=document.createElement('button'),progress=document.createElement('p');code.textContent=stream.url;download.textContent='Tải video';download.onclick=async()=>{download.disabled=true;try{const job=await api('/api/download/'+stream.id,{method:'POST'});for(;;){const state=await api('/api/jobs/'+job.id);progress.textContent=({queued:'Đang chờ…',downloading:'Đang tải…',done:'Đã tải xong.',error:'Tải thất bại.'})[state.status];if(state.status==='error')throw Error(state.error);if(state.status==='done'){const a=document.createElement('a');a.href='/api/files/'+job.id;a.textContent='Lưu file về máy';a.download=state.filename;progress.append(' ',a);break;}await new Promise(r=>setTimeout(r,1500));}}catch(err){progress.textContent=err.message;}finally{download.disabled=false;}};card.append(code,download,progress);results.append(card);}}catch(err){statusEl.textContent=err.message;}finally{button.disabled=false;}};
</script></html>
